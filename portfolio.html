  <div id="portfolio-overlay" class="image-overlay" aria-hidden="true" role="dialog" aria-label="Expanded artwork preview">
    <div class="overlay-content">
      <img id="portfolio-overlay-img" src="" alt="Expanded artwork preview">
    </div>
    <div class="close-hint">click outside the image or press escape to close!</div>
  </div>
 
  <!-- theme and expanded artwork script -->
  <script src="theme.js"></script>
  <script>
    const portfolioImages = document.querySelectorAll('.portfolio-grid img');
    const portfolioOverlay = document.getElementById('portfolio-overlay');
    const portfolioOverlayImg = document.getElementById('portfolio-overlay-img');
 
    const closePortfolioOverlay = () => {
      portfolioOverlay.classList.remove('active');
      portfolioOverlay.setAttribute('aria-hidden', 'true');
      portfolioOverlayImg.src = '';
      portfolioOverlayImg.alt = 'Expanded artwork preview';
      document.body.style.overflow = '';
    };
 
    portfolioImages.forEach((image) => {
      image.addEventListener('click', () => {
        portfolioOverlayImg.src = image.src;
        portfolioOverlayImg.alt = image.alt || 'Expanded artwork preview';
        portfolioOverlay.classList.add('active');
        portfolioOverlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      });
    });
 
    portfolioOverlay.addEventListener('click', (event) => {
      if (event.target === portfolioOverlay) {
        closePortfolioOverlay();
      }
    });
 
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && portfolioOverlay.classList.contains('active')) {
        closePortfolioOverlay();
      }
    });
  </script>
