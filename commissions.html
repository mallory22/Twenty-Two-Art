<!-- Footer -->
<footer>

      <p>contact: mallorytwentytwo@gmail.com</p>
    </div>
    <div class="palette">
      <div class="color-dot" style="background: #231942;"></div>
      <div class="color-dot" style="background: #4a3b7a;"></div>
      <div class="color-dot" style="background: #8ca2e8;"></div>
      <div class="color-dot" style="background: #a698e8;"></div>

    </div>
  </footer>

  <div id="commissions-overlay" class="image-overlay" aria-hidden="true" role="dialog" aria-label="Expanded example preview">
    <div class="overlay-content">
      <img id="commissions-overlay-img" src="" alt="Expanded example preview">
    </div>
    <div class="close-hint">click outside the image or press escape to close!</div>
  </div>

  <!-- Theme Toggle Script -->
  <script src="theme.js"></script>
  <script>
    const commissionsImages = document.querySelectorAll('.example-img');
    const commissionsOverlay = document.getElementById('commissions-overlay');
    const commissionsOverlayImg = document.getElementById('commissions-overlay-img');

    const closeCommissionsOverlay = () => {
      commissionsOverlay.classList.remove('active');
      commissionsOverlay.setAttribute('aria-hidden', 'true');
      commissionsOverlayImg.src = '';
      commissionsOverlayImg.alt = 'Expanded example preview';
      document.body.style.overflow = '';
    };

    commissionsImages.forEach((image) => {
      image.addEventListener('click', () => {
        commissionsOverlayImg.src = image.src;
        commissionsOverlayImg.alt = image.alt || 'Expanded example preview';
        commissionsOverlay.classList.add('active');
        commissionsOverlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      });
    });

    commissionsOverlay.addEventListener('click', (event) => {
      if (event.target === commissionsOverlay) {
        closeCommissionsOverlay();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && commissionsOverlay.classList.contains('active')) {
        closeCommissionsOverlay();
      }
    });
  </script>
</body>

</html>
